name: Release

on:
  push:
    # Triggered by ``git push origin v1.2.1`` and similar version tags.
    # Pre-release tags (e.g. v1.2.1-rc1) are also matched.
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag to release, for example v1.2.1"
        required: true
        type: string

# The release job needs ``contents: write`` so the workflow can upload the
# built archives to the GitHub Release the tag creates.
permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Verify tag matches application version
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          app_version="$(python -c 'from version import __version__; print(__version__)')"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Release tag $RELEASE_TAG does not match application version $app_version" >&2
            exit 1
          fi

  build-windows:
    name: Build Windows installer
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 1.3.1 dropped python-vlc in favour of PyAV; the FFmpeg shared
      # libs are bundled inside the PyAV wheel, so no choco install
      # step is needed here any more.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve Windows build script
        shell: pwsh
        run: |
          if (Test-Path "packaging/build_windows_optimized.py") {
            $script = "packaging/build_windows_optimized.py"
          } elseif (Test-Path "build_windows_optimized.py") {
            $script = "build_windows_optimized.py"
          } else {
            Write-Error "Windows build script was not found"
            exit 1
          }
          "BUILD_SCRIPT=$script" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Keep Windows runtime DLLs bundled
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Path $env:BUILD_SCRIPT
          $content = $content -replace "\s*'msvcp140_1',\r?\n", ""
          $content = $content -replace "\s*'vcruntime140_1',\r?\n", ""
          Set-Content -Path $env:BUILD_SCRIPT -Value $content -NoNewline

      - name: Build Windows onedir distribution
        run: >
          python $env:BUILD_SCRIPT
          --include-module distutils
          --include-module wheel
          --include-module pip
          --include-module easy_install
          --include-module unittest
          --include-module venv
          --include-module ensurepip
          --include-module lib2to3
          --include-module pkg_resources

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows installer (onedir)
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v")
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}","${env:ProgramFiles}" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          Write-Host "Using ISCC: $iscc"
          & $iscc "/DAppVersion=$version" "packaging\RABET.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed ($LASTEXITCODE)"; exit 1 }

      - name: Stage installer asset
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v")
          $src = "dist/RABET-Setup-$version.exe"
          if (-not (Test-Path $src)) { Write-Error "Installer not found: $src"; exit 1 }
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          $stage = "release-assets/RABET-Windows-$version-Setup"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # Zip the installer so browsers and managed networks are less likely
          # to block the download solely because the release asset is an .exe.
          Copy-Item -Path $src -Destination "$stage/RABET-Setup.exe" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "release-assets/RABET-Windows-$version-Setup.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Build Windows onefile (portable)
        run: >
          python $env:BUILD_SCRIPT
          --onefile
          --include-module distutils
          --include-module wheel
          --include-module pip
          --include-module easy_install
          --include-module unittest
          --include-module venv
          --include-module ensurepip
          --include-module lib2to3
          --include-module pkg_resources

      - name: Stage portable asset
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v")
          $src = "dist/RABET.exe"
          if (-not (Test-Path $src)) { Write-Error "Portable exe not found: $src"; exit 1 }
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          $stage = "release-assets/RABET-Windows-$version-portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # Single-file portable: keep the executable name simple inside the
          # archive while shipping the asset itself as a browser-friendlier zip.
          Copy-Item -Path $src -Destination "$stage/RABET.exe" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "release-assets/RABET-Windows-$version-portable.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: RABET-Windows-${{ env.RELEASE_TAG }}
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

  build-macos:
    name: Build macOS distribution (${{ matrix.arch }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target_arch: arm64
          - arch: x86_64
            runner: macos-15-intel
            target_arch: x86_64
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 1.3.1 dropped python-vlc in favour of PyAV. The PyAV macOS wheel
      # ships its own FFmpeg dylibs, so the brew install step is gone.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve macOS build script
        shell: bash
        run: |
          if [ -f "packaging/build_macos_optimized.py" ]; then
            script="packaging/build_macos_optimized.py"
          elif [ -f "build_macos_optimized.py" ]; then
            script="build_macos_optimized.py"
          else
            echo "macOS build script was not found" >&2
            exit 1
          fi
          echo "BUILD_SCRIPT=${script}" >> "$GITHUB_ENV"

      - name: Build unsigned macOS package
        run: python "$BUILD_SCRIPT" --target-arch "${{ matrix.target_arch }}"

      - name: Build macOS DMG
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          bash packaging/build_macos_dmg.sh "$version" "${{ matrix.arch }}"

      - name: Stage macOS DMG
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="dist/RABET-macOS-${{ matrix.arch }}-${version}.dmg"
          if [ ! -f "$asset" ]; then
            echo "Expected DMG was not found: $asset" >&2
            exit 1
          fi
          echo "ASSET_PATH=${asset}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$(basename "$asset")" >> "$GITHUB_ENV"

      - name: Upload macOS artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 30
          if-no-files-found: error

  build-linux:
    name: Build Linux distribution
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          # As of 1.3.1 RABET no longer needs libvlc; PyAV's manylinux
          # wheel bundles FFmpeg. Qt's xcb platform plugin still depends
          # on system GUI libraries on Linux, so install the same runtime
          # set documented in the release README before packaging.
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xkb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0 \
            libxrender1 \
            libx11-xcb1 \
            libsm6 \
            libice6 \
            libglib2.0-0 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve Linux build script
        shell: bash
        run: |
          if [ -f "packaging/build_linux_optimized.py" ]; then
            script="packaging/build_linux_optimized.py"
          elif [ -f "build_linux_optimized.py" ]; then
            script="build_linux_optimized.py"
          else
            echo "Linux build script was not found" >&2
            exit 1
          fi
          echo "BUILD_SCRIPT=${script}" >> "$GITHUB_ENV"

      - name: Build Linux onedir distribution
        run: python "$BUILD_SCRIPT"

      - name: Build Linux AppImage
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          version="${RELEASE_TAG#v}"
          bash packaging/build_linux_appimage.sh "$version"

      - name: Stage Linux AppImage
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          arch="$(uname -m)"
          asset="dist/RABET-Linux-${arch}-${version}.AppImage"
          if [ ! -f "$asset" ]; then
            echo "Expected AppImage was not found: $asset" >&2
            exit 1
          fi
          echo "ASSET_PATH=${asset}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$(basename "$asset")" >> "$GITHUB_ENV"

      - name: Upload Linux artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: "RABET-*"
          path: dist
          merge-multiple: true

      - name: Generate release body placeholder
        id: changelog
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cat > release_body.md <<'EOF'
          ## RABET vVERSION_PLACEHOLDER

          RABET vVERSION_PLACEHOLDER is a maintenance release. It fixes recording,
          playback, project-mode and analysis problems found in a review of 1.4.2,
          and three optional analyses now measure time from each file's recording
          start.

          ### Changed

          - **Optional analyses measure time from the recording start.**
            Files whose session starts at video time 0 give the same values as
            before; files whose session starts later in the video can change.
            - Predictability (Transition Analysis): the chance baseline no longer
              includes video before the session, which lowered the chance level and
              inflated the above-chance fraction.
            - Detailed reliability compares only the time both files recorded, from
              the later `RecordingStart` to the earlier `RecordingStart` + Test
              Duration. The compared window is shown above the results and in the
              export, and differing Test Durations are flagged on screen.
            - The bout raster and its figure are drawn from each file's recording
              start, with the axis titled "Time from recording start (s)".

          - **Clearing annotations during a recording discards the session.**
            Clear Annotations now asks to stop the recording and discard the session
            without saving (the default is No). Previously the recording kept running
            without its start marker, so the saved file could not be placed in time.
            Import Annotations waits until the recording is stopped.

          - **Replaced and unreadable files are kept.**
            In Project mode, the annotation file a new session replaces is kept next
            to it as `<name>.<date-time>.csv.bak`. An unreadable
            `user_action_map.json` or `settings.json` is kept as
            `<name>.corrupt-<date-time>` before defaults are used, and RABET says so
            after start-up.

          - **Clearer labels.**
            The record button reads Stop during a session (Cancel only while waiting
            for the start key). Remove in the project panel says whether the file
            will be deleted from disk or only removed from the list.

          ### Fixed

          - **Recording and playback**
            - Stepping back stopped at keyframes in MPEG-4 Part 2 videos with
              B-frames (common in AVI files), so only a few dozen frames could
              be reached. In AVI files whose frame time is not a whole number of
              milliseconds (e.g. 30 fps), every other step also skipped a frame.
            - Holding the Left arrow rewound only a few dozen frames on videos
              with long keyframe intervals, because key repeats that arrived
              during a step were dropped. They now add up into the next step,
              and a held key stops when it is released.
            - The playback speed slider packed 176 values (0.01x steps) into a
              narrow track, so many of them, such as 0.50x, could not be
              reached with the mouse. It now moves in 0.1x steps from 0.2x to
              2.0x, and the speed saved from the last session is applied at
              start-up instead of only being shown.
            - Opening a video during playback left play/pause stuck until RABET was
              restarted.
            - After a video failed to open, its duration stayed in place, so a
              recording could be started without a video.
            - A seek during playback left the recording paused, so key presses were
              ignored.
            - With "Preserve on rewind" off, a rewind could occasionally delete
              nothing, and a bare click on the position slider could delete recent
              annotations.
            - The last frames of a video could not be reached, a step after some
              seeks skipped a frame, and a session ending at the last frame did not
              complete.
            - A rewind landing on an event's onset left a zero-length event.
            - Unmapped keys showed a misleading "already active" notice.

          - **Project mode**
            - When a project video failed to load, the video left open saved its
              session under the failed video's name.
            - Answering "load existing annotations" discarded unsaved annotations
              without asking.
            - Closing a project did not stop a running recording.
            - Videos sharing a file name lost their annotation status on reload.

          - **Keyboard focus**
            - The action-map table, the position slider and the timeline could keep
              focus and swallow behaviour or arrow keys.
            - Delete could remove the wrong timeline event after events changed.

          - **Files and settings**
            - Importing an annotation CSV ignored its Test Duration.
            - Imported times were truncated to the millisecond below, and a byte
              order mark broke CSVs that start with the header row.
            - A saved recording duration with 0 minutes came back 5 minutes longer.
            - Metric configurations with colliding names were accepted on load, and
              the metric dialogs split or replaced some behaviour names.

          - **Visualization, reliability and stability**
            - Point events were invisible in the raster plot.
            - "Export Individual Plots" saved the same figure for every file.
            - Action maps with point behaviours could not be loaded in the
              Visualization tab, and custom colour maps were lost in the packaged
              app.
            - The "Note" row of a summary table was read as an animal in the
              Reliability tab.
            - Closing the disagreement review with Esc could crash RABET on exit.

          ### Compatibility

          Annotation CSVs keep the same format, and projects and settings from
          1.4.2 open unchanged. Two exports gain columns: Export Bouts adds
          `start_from_recording_s` and `end_from_recording_s` at the end of each
          row, and the Detailed reliability export adds the compared window to its
          first row (plus a warning row when the Test Durations differ).

          ### Documentation

          The user guide (English and Japanese) now describes the actual file
          locations, logging, rewind handling and recording controls.

          ### Packaging

          - **Windows installer and portable builds are zip-wrapped.**
            The release assets are `RABET-Windows-VERSION_PLACEHOLDER-Setup.zip`
            and `RABET-Windows-VERSION_PLACEHOLDER-portable.zip`. The portable
            zip contains a simple `RABET.exe`.

          - **macOS builds are distributed as DMG images.**
            Open the DMG, then drag `RABET.app` to Applications.

          - **Linux is distributed as an AppImage.**
            Make it executable and launch it directly.

          ### macOS first launch

          The macOS builds are unsigned and not notarized. After downloading
          the DMG, open it and drag `RABET.app` to Applications. On first
          launch, macOS may report that the app is "damaged" or cannot be
          verified. This is Gatekeeper quarantine, not a corrupt download.

          The most reliable fix is:

          ```bash
          xattr -dr com.apple.quarantine /Applications/RABET.app
          ```

          Then open `RABET.app` normally. You only need to do this once for
          each downloaded copy.
          EOF
          sed -i "s/VERSION_PLACEHOLDER/$version/g" release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') }}
          files: dist/*
          overwrite_files: true
